name: gmas
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # weasyprint has native deps best installed via conda-forge
  - weasyprint>=62.0
  - pip:
    - streamlit>=1.35.0
    - sqlalchemy>=2.0.0
    - alembic>=1.13.0
    - pandas>=2.2.0
    - plotly>=5.20.0
    - jinja2>=3.1.0
    - pydantic-settings>=2.0.0
    - python-dotenv>=1.0.0
    - httpx>=0.27.0
    - thefuzz>=0.22.0
    - python-Levenshtein>=0.25.0
    - pytest>=8.0.0
    - pytest-mock>=3.0.0
    - pytest-cov>=5.0.0
    - ruff>=0.4.0
    - mypy>=1.10.0
