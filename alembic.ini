# ============================================================
# File: alembic.ini
# Version: 1.1.0
# Created: 2026-06-25
# Modified: 2026-06-25
# Description: Alembic migration configuration for GMAS
# ============================================================

[alembic]
script_location = src/db/migrations
prepend_sys_path = .

# Override with DATABASE_URL env var in env.py; this is the fallback
sqlalchemy.url = sqlite:///data/gmas.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
