# Weekly grant email — runs the GrantNova discovery scan and emails the
# ranked grant list to the team.
#
# Schedule: Mondays at 12:00 UTC = 8:00 AM Eastern (EDT, Mar–Nov)
#                                = 7:00 AM Eastern (EST, Nov–Mar)
# GitHub cron has no timezone/DST support, so the hour shifts by one in winter.
#
# The Gmail app password comes from the repository secret GMAIL_APP_PASSWORD.
# Sender and recipients are not sensitive and are set inline below.

name: Weekly Grant Email

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays, 12:00 UTC
  workflow_dispatch:        # adds the manual "Run workflow" button

jobs:
  send-grant-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Only what the email job needs. The full requirements.txt pulls in
        # streamlit/plotly (unused here) and weasyprint (needs GTK system
        # libraries), which would slow the run down and break it for no benefit.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "sqlalchemy>=2.0.0" \
            "httpx>=0.27.0" \
            "beautifulsoup4>=4.12.0" \
            "lxml>=5.2.0" \
            "jinja2>=3.1.0" \
            "pydantic-settings>=2.0.0" \
            "python-dotenv>=1.0.0" \
            "pyyaml>=6.0.0" \
            "thefuzz>=0.22.0" \
            "python-Levenshtein>=0.25.0"

      - name: Run grant search and send email
        env:
          GMAIL_USER: dojoatsomernova@gmail.com
          EMAIL_TO: linda@somernova.com, jss@kristinphelan.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m scripts.send_weekly_grant_email
